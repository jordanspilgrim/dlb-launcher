[project]
name = "dlb-launcher"
version = "0.1.0"
description = "Wake your idle AI-coding-agent sessions when DLB mail arrives. Wraps Claude Code, Codex CLI, or Gemini CLI with a PTY+inbox watcher so two independent threads can actually collaborate."
readme = "README.md"
authors = [{ name = "Jordan S Pilgrim" }]
license = { text = "MIT" }
requires-python = ">=3.11"
# Intentionally zero runtime deps — stdlib only.
dependencies = []

[project.urls]
Homepage = "https://github.com/jordanspilgrim/dlb-launcher"
Repository = "https://github.com/jordanspilgrim/dlb-launcher"
Issues = "https://github.com/jordanspilgrim/dlb-launcher/issues"

[project.scripts]
dlb-launcher = "dlb_launcher.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlb_launcher"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Disable pytest's stdout capture — the launcher integration test
# redirects sys.stdout via os.fdopen to read what the child echoes;
# pytest's capture machinery (active by default) interferes with that
# redirection because it caches references to the original sys.stdout
# at module load time.
addopts = "-s"
